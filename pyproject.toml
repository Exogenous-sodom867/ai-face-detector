[tool.poetry]
name = "ai-face-detector"
version = "0.1.0"
description = "AI-powered face authenticity detection using Transfer Learning"
authors = ["Furkan Köykıran"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.1.0"
torchvision = "^0.16.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pillow = "^10.2.0"
python-multipart = "^0.0.6"
matplotlib = "^3.8.0"
tqdm = "^4.66.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
